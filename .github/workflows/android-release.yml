yaml
name: Android · Signed Release AAB

on:
  workflow_dispatch:
    inputs:
      version_note:
        description: "Optional note shown in the artifact name"
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-aab:
    name: Build & sign AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build web bundle
        working-directory: frontend
        run: yarn build

      - name: Install Capacitor CLI + Android platform
        working-directory: frontend
        run: yarn add -D @capacitor/cli @capacitor/android

      - name: Scaffold native Android project if needed
        working-directory: frontend
        run: |
          if [ ! -f ../android/gradlew ]; then
            npx cap add android
          else
            echo "Native project present"
          fi

      - name: Sync web assets into native project
        working-directory: frontend
        run: npx cap sync android

      - name: Accept Android SDK licenses + install API 36
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Restore keystore from secret
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > acechasers-upload.jks

      - name: Write keystore.properties
        working-directory: android
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/acechasers-upload.jks
          storePassword=${STORE_PW}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PW}
          EOF

      - name: Build signed release AAB
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          java -version
          ./gradlew clean bundleRelease --stacktrace --info --no-daemon --max-workers=2

      - name: Verify AAB signature
        working-directory: android
        run: |
          set -e
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tee /tmp/jarverify.log
          grep -q "jar verified" /tmp/jarverify.log

      - name: Shred keystore + properties from runner
        if: always()
        working-directory: android
        run: |
          shred -u -z acechasers-upload.jks keystore.properties 2>/dev/null || \
            rm -f acechasers-upload.jks keystore.properties

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: acechasers-app-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
